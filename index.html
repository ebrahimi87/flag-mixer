<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1030">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flag Mixer">
  <meta name="description" content="Merge matching flags to discover all 197 countries. A cozy idle merge game.">
  <title>Flag Mixer</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>

  <div id="backdrop" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="stars"></div>
    <div class="stars s2"></div>
  </div>

  <div id="app">

    <!-- HEADER: money, logo, rebirth goal, settings -->
    <header id="header">
      <div id="money" class="panel">
        <div id="cash-row"><span class="coin-icon"></span><span id="cash-display">$100.00</span></div>
        <div id="income-row"><span id="income-display">+$2.00/sec</span><span id="multiplier-badge"></span></div>
      </div>

      <div id="logo" aria-label="Flag Mixer">
        <span class="logo-globe"></span>
        <span class="logo-text"><span class="l1">FLAG</span><span class="l2">MIXER</span></span>
      </div>

      <div id="rebirth" class="panel">
        <div class="reqs">
          <div class="rebirth-head"><span id="rebirth-title">Rebirth 1</span><span id="rebirth-reward"></span></div>
          <div class="req" id="req-flags">
            <img id="req-flag-img" src="" alt="">
            <div class="bar"><div class="fill"></div><span class="bar-text"></span></div>
          </div>
          <div class="req" id="req-cash">
            <span class="coin-icon"></span>
            <div class="bar"><div class="fill"></div><span class="bar-text"></span></div>
          </div>
        </div>
        <button id="rebirth-btn" class="btn-candy purple" aria-label="Rebirth"><span class="icon"></span><span>Rebirth</span></button>
      </div>

      <div id="header-buttons">
        <button id="sound-btn" class="icon-btn" aria-label="Sound on or off"></button>
        <button id="menu-btn" class="icon-btn" aria-label="Menu"></button>
      </div>
    </header>

    <!-- BOARD -->
    <main id="board">
      <div id="tip"></div>
      <div id="tray-area"><div id="slots-grid"></div></div>
    </main>

    <!-- SHOP AND UPGRADES -->
    <section id="dock">
      <div id="shop">
        <button id="buy-btn" class="btn-candy green">
          <span id="buy-medal" class="mini-medal"><img src="" alt=""></span>
          <span class="buy-text">
            <span id="buy-name">Buy Afghanistan</span>
            <span id="buy-cost">$100.00</span>
          </span>
        </button>
        <div id="buy-tier-upgrade"></div>
      </div>
      <div id="upgrades">
        <div class="section-title">Upgrades</div>
        <div id="upgrades-list"></div>
      </div>
    </section>

    <!-- FLAG ATLAS STRIP -->
    <section id="atlas" class="panel">
      <div class="atlas-head">
        <span class="section-title">Flag Atlas</span>
        <span id="atlas-count">1 / 197</span>
        <div class="bar"><div class="fill"></div></div>
        <button id="atlas-btn" class="chip-btn">View all</button>
      </div>
      <div id="collection-strip"></div>
    </section>

  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="floaters" aria-hidden="true"></div>
  <div id="drag-ghost" aria-hidden="true"></div>
  <div id="banner" aria-live="polite"></div>
  <div id="modal-root"></div>

</body>
</html>
